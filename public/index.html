<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Usage Monitor</title>
    <link rel="stylesheet" href="/styles.css?v=agents-1" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <div class="eyebrow"><span id="live-dot" class="live-dot"></span><span id="connection">Connecting</span></div>
          <h1>Agent Usage Monitor</h1>
          <p>Local Claude Code and Codex usage by prompt, model, and subagent.</p>
        </div>
        <div class="actions">
          <select id="provider" aria-label="Agent">
            <option value="" selected>All agents</option>
            <option value="claude">Claude</option>
            <option value="codex">Codex</option>
          </select>
          <select id="days" aria-label="Date range">
            <option value="today" selected>Today</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <button id="rescan" type="button">Rescan</button>
          <a class="button-link" href="/prices.html" id="model-prices">Model prices</a>
        </div>
      </header>

      <section id="limits" class="limits" aria-label="Plan usage"></section>
      <section id="summary" class="summary" aria-label="Summary"></section>
      <section class="section-heading">
        <h2>Prompt history · <span id="list-period">Today</span></h2>
        <span id="updated-at"></span>
      </section>
      <section id="turn-list" class="turn-list" aria-live="polite"></section>
    </main>
    <script type="module" src="/app.js?v=agents-1"></script>
  </body>
</html>
